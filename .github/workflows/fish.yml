name: fish

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  swim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 看看他说了什么
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FISH_CHANCE: "0.28"
        run: python3 fish.py

      - name: 记住这次
        run: |
          git config user.name fish
          git config user.email fish@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "memory $(date -u +%F%H%M)"
          git push