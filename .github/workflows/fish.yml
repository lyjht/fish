name: fish

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 要不要说话
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FISH_CHANCE: "0.28"
        run: python3 fish.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: 记住这次
        run: |
          git config user.name fish
          git config user.email fish@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "memory $(date -u +%F)"
          git push
